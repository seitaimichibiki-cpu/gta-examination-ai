<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 検査表 AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <div class="logo">
                <i class="fa-solid fa-notes-medical"></i>
                <h1>GTA Examination AI</h1>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <a href="help.html" class="icon-btn" title="使い方・ヘルプ" style="text-decoration: none; display: flex; align-items: center;">
                    <i class="fa-solid fa-circle-question"></i>
                </a>
                <button id="settings-btn" class="icon-btn" title="API設定">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="app-main">
        <!-- Input Section -->
        <section class="form-section">
            <div class="form-scroll-container" id="form-container" style="padding: 2rem; overflow-y: auto; height: 100%;">
                <!-- Data will be injected here via app.js -->
            </div>
        </section>

        <!-- Result / AI Panel Section -->
        <aside class="result-section">
            <div class="result-card">
                <div class="result-header">
                    <h2>AI 判定</h2>
                    <button id="run-ai-btn" class="primary-btn">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> 判定を実行
                    </button>
                </div>
                
                <div id="ai-output" class="ai-output-container">
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <p>左の検査項目にチェックを入れ、<br>「判定を実行」をクリックしてください。</p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-backdrop hidden">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fa-solid fa-key"></i> API設定</h2>
                <button class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">判定を行うためにGoogle Gemini APIキーが必要です。</p>
                <div class="input-group">
                    <label for="api-key-input">Gemini API Key</label>
                    <input type="password" id="api-key-input" placeholder="AIzaSy...">
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings-btn" class="primary-btn">保存</button>
            </div>
        </div>
    </div>

    <!-- AI Prompt Data (Hidden) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
